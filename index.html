<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat-box h3 {
            color: #764ba2;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-box .value {
            color: #667eea;
            font-size: 2em;
            font-weight: bold;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        table tr:hover {
            background: #f5f5f5;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 0.9em;
            }
            
            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Electricity Dashboard</h1>
            <p>Real-time monitoring of users and usage statistics</p>
        </header>
        
        <div id="error-container"></div>
        <div id="loading" class="loading">Loading data...</div>
        <div id="content" style="display: none;">
            <div class="stats" id="stats-container"></div>
            <div class="dashboard">
                <div class="card">
                    <h2>Users by Region</h2>
                    <canvas id="usersChart"></canvas>
                </div>
                <div class="card">
                    <h2>Usage by Region</h2>
                    <canvas id="usageChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>Users Data</h2>
                <div style="overflow-x: auto;">
                    <table id="usersTable"></table>
                </div>
            </div>
            <div class="card">
                <h2>Usage Data</h2>
                <div style="overflow-x: auto;">
                    <table id="usageTable"></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let usersChart, usageChart;
        
        async function loadData() {
            try {
                const usersResponse = await fetch('electricity_users_en.json');
                const usageResponse = await fetch('electricity_usages_en.json');
                
                if (!usersResponse.ok || !usageResponse.ok) {
                    throw new Error('Failed to load JSON files');
                }
                
                const users = await usersResponse.json();
                const usageData = await usageResponse.json();
                const usage = usageData.Sheet1;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                displayStats(users, usage);
                displayCharts(users, usage);
                displayTables(users, usage);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-container').innerHTML = 
                    `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }
        
        function displayStats(users, usage) {
            const totalUsers = users.reduce((sum, user) => sum + (user.residential_count || 0) + (user.small_business_count || 0) + (user.medium_business_count || 0) + (user.large_business_count || 0) + (user.specialized_business_count || 0), 0);
            const statsHTML = `
                <div class="stat-box">
                    <h3>Total Users</h3>
                    <div class="value">${totalUsers}</div>
                </div>
                <div class="stat-box">
                    <h3>Total Records</h3>
                    <div class="value">${usage.length || 0}</div>
                </div>
                <div class="stat-box">
                    <h3>Avg Usage (KWh)</h3>
                    <div class="value">${getAverageUsage(usage).toFixed(2)}</div>
                </div>
            `;
            document.getElementById('stats-container').innerHTML = statsHTML;
        }
        
        function getAverageUsage(usage) {
            if (!usage.length) return 0;
            const totals = usage.map(item => (item.residential_kwh || 0) + (item.small_business_kwh || 0) + (item.medium_business_kwh || 0) + (item.large_business_kwh || 0));
            const sum = totals.reduce((acc, val) => acc + val, 0);
            return sum / usage.length;
        }
        
        function displayCharts(users, usage) {
            const usersByRegion = groupBy(users, 'province_name');
            const usageByRegion = groupUsageByRegion(usage);
            
            // Users Chart - showing number of provinces (but each has one entry)
            const usersCtx = document.getElementById('usersChart').getContext('2d');
            if (usersChart) usersChart.destroy();
            usersChart = new Chart(usersCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(usersByRegion),
                    datasets: [{
                        label: 'Number of Provinces',
                        data: Object.values(usersByRegion).map(arr => arr.length),
                        backgroundColor: '#667eea',
                        borderColor: '#764ba2',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
            
            // Usage Chart
            const usageCtx = document.getElementById('usageChart').getContext('2d');
            if (usageChart) usageChart.destroy();
            usageChart = new Chart(usageCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(usageByRegion),
                    datasets: [{
                        data: Object.values(usageByRegion),
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe']
                    }]
                },
                options: { responsive: true }
            });
        }
        
        function displayTables(users, usage) {
            displayUsersTable(users);
            displayUsageTable(usage);
        }
        
        function displayUsersTable(users) {
            const thead = '<tr><th>Province</th><th>Year</th><th>Residential Count</th><th>Small Business</th><th>Medium Business</th><th>Large Business</th></tr>';
            const tbody = users.slice(0, 10).map(user => 
                `<tr><td>${user.province_name || '-'}</td><td>${user.year || '-'}</td><td>${user.residential_count || '-'}</td><td>${user.small_business_count || '-'}</td><td>${user.medium_business_count || '-'}</td><td>${user.large_business_count || '-'}</td></tr>`
            ).join('');
            document.getElementById('usersTable').innerHTML = thead + tbody;
        }
        
        function displayUsageTable(usage) {
            const thead = '<tr><th>Province</th><th>Year</th><th>Residential KWh</th><th>Small Business KWh</th><th>Medium Business KWh</th><th>Large Business KWh</th></tr>';
            const tbody = usage.slice(0, 10).map(item => 
                `<tr><td>${item.province_name || '-'}</td><td>${item.year || '-'}</td><td>${item.residential_kwh || '-'}</td><td>${item.small_business_kwh || '-'}</td><td>${item.medium_business_kwh || '-'}</td><td>${item.large_business_kwh || '-'}</td></tr>`
            ).join('');
            document.getElementById('usageTable').innerHTML = thead + tbody;
        }
        
        function groupBy(arr, key) {
            return arr.reduce((acc, item) => {
                const group = item[key] || 'Unknown';
                acc[group] = acc[group] || [];
                acc[group].push(item);
                return acc;
            }, {});
        }
        
        function groupUsageByRegion(usage) {
            return usage.reduce((acc, item) => {
                const region = item.province_name || 'Unknown';
                const totalKwh = (item.residential_kwh || 0) + (item.small_business_kwh || 0) + (item.medium_business_kwh || 0) + (item.large_business_kwh || 0);
                acc[region] = (acc[region] || 0) + totalKwh;
                return acc;
            }, {});
        }
        
        loadData();
    </script>
</body>
</html>
